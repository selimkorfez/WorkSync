<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | WorkSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #dee2e6, #cbd3da);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }

        .form-control {
            border-radius: 0.5rem;
        }

        .btn-login {
            border-radius: 0.5rem;
        }

        .logo {
            font-weight: bold;
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: #0d6efd;
        }

        .position-relative .toggle-password {
            position: absolute;
            top: 50%;
            right: 1rem;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
        }

        #error-msg {
            color: red;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
<div class="login-card text-center">
    <div class="logo">WorkSync</div>
    <p class="text-muted mb-4">Sign in to manage your Workflow</p>
    <p class="small text-muted">Local demo: <code>admin@worksync.local</code> / <code>admin123</code></p>

    <form method="post" th:action="@{/login}">
    <div class="mb-3 text-start">
        <label class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
    </div>

    <div class="mb-3 text-start">
        <label class="form-label">Password</label>
        <div class="position-relative">
            <input type="password" id="password" name="password" class="form-control pe-5" placeholder="Your password" required>
            <i class="bi bi-eye-slash toggle-password position-absolute top-50 end-0 translate-middle-y me-3" id="togglePassword"></i>
        </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 btn-login mt-2">Login</button>
    <div id="error-msg" class="mt-2" th:if="${error}" th:text="${error}"></div>
    </form>
</div>

<script>
    // 👁️ Toggle Password
    document.getElementById("togglePassword").addEventListener("click", function () {
        const pwd = document.getElementById("password");
        const icon = this;
        const isVisible = pwd.type === "text";
        pwd.type = isVisible ? "password" : "text";
        icon.classList.toggle("bi-eye", isVisible);
        icon.classList.toggle("bi-eye-slash", !isVisible);
    });
</script>
</body>
</html>
